project:
  name: "AI Music Teacher Agent"
  id: "ai-music-teacher-agent"
  description: "Sistema agentico para ensino personalizado de violão (nylon) e cavaquinho em estilos brasileiros."
  phase: "mvp"
  goals:
    - "Receber uma música e objetivo e gerar plano de estudo estruturado."
    - "Sugerir materiais relevantes e explicar a música de forma prática."
    - "Entregar um MVP local funcionando via CLI ou UI simples."
  audience:
    - "Estudantes de violão (nylon) e cavaquinho."
    - "Pessoas que querem aprender música brasileira com plano estruturado."
  constraints:
    performance: "Respostas rápidas para uso interativo, sem cloud."
    security: "Não armazenar dados sensíveis desnecessariamente; uso local."
    infra: "Local-only, sem hospedagem em nuvem."
    compliance: "Respeitar copyrights e evitar reprodução integral de partituras proprietárias."
  stack:
    frontend: "Streamlit ou CLI Python"
    backend: "Python"
    database: "JSON local"
    devops: "Docker local, scripts shell, Makefile"
  nonFunctionalRequirements:
    - "Boa experiência de uso local."
    - "Evolução incremental do plano de estudo."
    - "Modularidade dos agentes e simplicidade para manutenção."
  deliverables:
    - "Requisitos em Markdown"
    - "Arquitetura em Mermaid"
    - "Wireframes"
    - "Código funcional"
    - "Testes unitários e automatizados"
    - "IaC local / Docker"
  sprint:
    current: 1
    status: "qa_passed_pending_pm_final_approval"
    goal: "Entregar MVP local via CLI com agentes orquestrados e testes automatizados."
    artifacts:
      architecture: "docs/architecture-mvp.md"
      backlog: "docs/sprint-01-backlog.md"
      qa_report: "docs/qa-report-sprint-01.md"
      readme: "README.md"
    checkpoints:
      - "PM aprova arquitetura e backlog antes da implementacao."
      - "PM aprova apos QA antes de fechar o sprint."
